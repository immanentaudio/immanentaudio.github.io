name: Sync Gumroad reviews

on:
  schedule:
    # 07:20 UTC daily. Off the hour on purpose - GitHub's scheduler is busiest
    # right at :00 and delays cron runs that land there.
    - cron: "20 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gumroad-reviews
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch reviews
        run: python3 scripts/fetch_gumroad_reviews.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- reviews/gumroad.json; then
            echo "No new reviews."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/gumroad.json
          git commit -m "Sync Gumroad reviews"
          git push
